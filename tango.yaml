# tango 配置文件
#
# 配置按用途分组为若干区块；只有进程级的 mode / instanceID 留在顶层。
# YAML 键即结构字段；环境变量用 TANGO_ 前缀、"." 换成 "_"
# （如 mongo.uri → TANGO_MONGO_URI）。CLI 仅保留 --mongoURI / --logLevel /
# --mode 三个常用 flag，其余细调走 yaml 或 env。

# 运行模式：daemon（默认）/ once / ingest / backfill / agent
mode: "daemon"

# 本进程唯一标识，仅来自环境变量 TANGO_INSTANCE_ID。
# agent 模式必填（定向任务 + 心跳注册），其他模式忽略。
# instanceID 不在文件里写，部署时：export TANGO_INSTANCE_ID=prod-agent-A

# ---------------------------------------------------------------------------
# logging: 日志输出
# ---------------------------------------------------------------------------
logging:
  # 日志级别：debug / info / warn / error
  level: "info"
  # 日志编码：text（默认）/ json
  format: "text"

# ---------------------------------------------------------------------------
# mongo: 连接与写入重试
# ---------------------------------------------------------------------------
mongo:
  # MongoDB 连接 URI（必填）；数据库名取自 URI path
  uri: "mongodb://localhost:27017/tango"
  # 单次 bulk write 最大重试总时间
  maxElapsedTime: "10s"
  # 初始连接握手超时
  connectTimeout: "10s"
  # 等待可用服务器的超时
  serverSelectionTimeout: "30s"

# ---------------------------------------------------------------------------
# source: 文件采集（daemon / once 模式）
# ---------------------------------------------------------------------------
source:
  # 日志文件匹配（glob/正则）；daemon/once 必需，其他模式忽略
  logPattern: ["/var/log/ta.*.log"]
  # 文件追踪模式：hybrid（默认，事件+轮询兜底）/ poll / event
  tailMode: "hybrid"
  # 重扫新文件的间隔（daemon）
  rescanInterval: "30s"
  # poll/hybrid 模式到达 EOF 后的重读间隔
  pollInterval: "200ms"
  # 单行最大字节数（默认 10MB）
  maxLineBytes: 10485760

# ---------------------------------------------------------------------------
# pipeline: 批量与并行写
# ---------------------------------------------------------------------------
pipeline:
  # 目标批量大小；min=batchSize/4, max=batchSize*2 自动推导
  batchSize: 1000
  # 并行写入 worker 数
  batchWorkers: 2
  # 批量定时刷新间隔
  flushInterval: "1s"
  # 每 worker 行通道缓冲；0=按 batchSize*2 派生
  channelBuffer: 0
  # 每 worker dead-letter 批容量
  deadLetterCap: 128

# ---------------------------------------------------------------------------
# filter: 上传过滤（expr-lang 表达式）
# 语法见 https://expr-lang.org/docs/language-definition
# - include（正向）：非空时记录须至少命中一条才保留；空=全放行
# - exclude（反向）：任一命中即丢弃，发生在 include 之后
# 表达式作用于扁平化记录：#type、#event_name 及 properties.* 提升到顶层的
# 字段都可直接引用（# 前缀会透明改写为 $env["#field"]）。
# 被过滤掉的记录不写 dead_letter，是有意丢弃。
# ---------------------------------------------------------------------------
filter:
  include: []
  exclude: []
  # 示例：
  # include:
  #   - '#type == "track" && #event_name in ["login", "pay"]'
  #   - '#type startsWith "user_"'
  # exclude:
  #   - 'debug == true'

# ---------------------------------------------------------------------------
# backfill: 从数数 OpenAPI 拉取历史数据导入（mode=backfill 或 `tango backfill`）
# 按 $part_date 切天 → submit → poll → 分页拉取 → 与 daemon 相同的管线写入。
# 续传：进度持久化到 _backfill_progress（按 runID）；taskId 失效自动重 submit，
# #uuid/#user_id upsert 保证幂等。filter 同时编译成 Presto WHERE 下推 + 本地兜底。
# ---------------------------------------------------------------------------
backfill:
  apiBaseURL: ""            # 数数 OpenAPI 网关，无尾斜杠
  token: ""                 # 项目查询 token（每项目一个）
  proxy: ""                 # 可选出站代理：socks5:// / http:// / https://；空=直连
  projectID: 0              # 拼表名 v_event_<id> / v_user_<id>
  schemaPrefix: ""          # 表名前缀，如 "ta" → ta.v_user_35
  table: "event"            # event / user
  partDateRange:            # 分区日期范围（event 表必填，按天分块）
    start: "2026-01-01"
    end:   "2026-05-28"
  # eventTimeRange:         # 可选：用 #event_time 进一步收窄
  #   start: "2026-01-01 00:00:00"
  #   end:   "2026-05-28 23:59:59"
  pageSize: 10000           # 服务端分页大小（>=1000）
  pageRetries: 3            # 单页瞬时错误的重试次数（重拉幂等，靠 #uuid/#user_id 去重）
  paginate: true            # true=submit 带 pageSize 服务端分页+逐页续传；false=单次全量流式
  pollInterval: "5s"        # 任务状态轮询间隔
  pollTimeout: "60m"        # 单 chunk submit→FINISHED 最长等待
  runID: ""                 # 断点续传标识；同 runID 重启即续跑
  progressCollection: "_backfill_progress"
  forceSkipExisting: true   # event 一律 $setOnInsert 跳过已存在 #uuid
  skipLocalFilter: false    # true=只信 SQL 下推，关闭本地兜底

# ---------------------------------------------------------------------------
# remoteConfig: 从 MongoDB 拉一个 JSON 文档逐字段覆盖本地配置
# 启动时所有模式拉一次；daemon 每 syncInterval 再拉，仅 filter 热生效。
# 作用域按 db 隔离。mongo/remoteConfig/mode/instanceID 不可被远程覆盖。
# 文档形如 { "_id": "default", "filter": { "include": [...], "exclude": [] } }
# ---------------------------------------------------------------------------
remoteConfig:
  enabled: false
  collection: "_tango_config"
  documentID: "default"
  syncInterval: "1h"

# ---------------------------------------------------------------------------
# agent: 任务 worker 模式（mode=agent 或 `tango agent`）
# 注册心跳 → 从共享队列认领任务 → 执行(backfill/sql) → 续租 → 汇报。
# pull 模型：原子 claim + 租约保证不重复执行与故障回收；心跳仅用于定向
# fail-fast 与在线列表。任务/配置都按 db 隔离。
# TA 连接信息走上面的 backfill 块；任务 payload 只说"取什么"。
# ---------------------------------------------------------------------------
agent:
  tasksCollection: "_tango_tasks"
  instancesCollection: "_tango_instances"
  pollInterval: "10s"       # 轮询认领间隔
  leaseDuration: "5m"       # 任务租约；超时未续可被回收
  heartbeatInterval: "30s"  # 心跳刷新间隔
  instanceTTL: "90s"        # 心跳超过此时长视为离线
