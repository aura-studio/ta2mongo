# tango 配置文件
#
# 优先级（从低到高）：内置默认值 < 此文件 < 环境变量（TANGO_* 前缀）< 命令行参数
#
# 环境变量示例：
#   TANGO_MONGO_URI=mongodb://localhost:27017/tango
#   TANGO_LOG_LEVEL=debug
#   TANGO_BATCH_WORKERS=4
#
# mode 决定运行模式（也可通过子命令指定：tango daemon / tango once / tango ingest）：
#   - daemon：持续追尾日志文件，增量导入（默认）
#   - once：一次性读取所有匹配文件，处理完退出，输出统计摘要
#   - ingest：同步阻塞上传模式（从 CLI 参数或 stdin 读取）

mongo:
  uri: "mongodb://localhost:27017/tango"

ta:
  # 每个字符串是一个正则，用于匹配文件路径（仅 daemon/once 模式使用）
  logPattern:
    - "/var/log/ta.*.log"

tail:
  rescanSeconds: 30

batch:
  sizeMin: 0          # 0 = 自动（sizeInitial / 4）
  sizeInitial: 1000
  sizeMax: 0          # 0 = 自动（sizeInitial * 2）
  workers: 2
  channelSize: 1000
  flushInterval: "1s"

retry:
  maxElapsedTime: "10s"

log:
  level: "info"
