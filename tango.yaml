# tango 配置文件

# mode: 运行模式 (daemon / once / ingest / backfill）
mode: "daemon"

# MongoDB 连接 URI
mongoURI: "mongodb://localhost:27017/tango"

# 日志级别：debug / info / warn / error
logLevel: "info"

# 日志文件匹配正则（daemon/once 模式使用）
logPattern: ["/var/log/ta.*.log"]

# 目标批量大小；min=batchSize/4, max=batchSize*2 自动推导
batchSize: 1000

# 并行写入 worker 数
batchWorkers: 2

# 批量定时刷新间隔
flushInterval: "1s"

# 文件重扫间隔，daemon 模式使用（如 "30s"、"1m"）
rescanInterval: "30s"

# 单次 bulk write 最大重试总时间
maxElapsedTime: "10s"

# 文件追踪模式：hybrid（默认）/ poll / event
# hybrid — 事件驱动为主 + 轮询兜底，兼顾低延迟与可靠性
# poll   — 纯轮询（每 200ms），不依赖系统通知，不会卡住
# event  — 纯事件驱动（kqueue/inotify），延迟最低但可能因通知丢失而卡死
tailMode: "hybrid"

# 日志上传过滤（expr-lang 表达式，语法见 https://expr-lang.org/docs/language-definition）
#
# - filterInclude（正向）：列表非空时，记录必须至少命中一条才会保留；
#   列表为空（默认）则不做正向过滤，所有记录都进入下一步。
# - filterExclude（反向）：任一条命中即丢弃，发生在 include 之后。
#
# 表达式作用于已扁平化的记录文档：#type、#event_name 等系统字段以及
# properties.* 中提升到顶层的业务字段都可直接引用。带 # 前缀的字段会被
# 透明改写为 $env["#field"]，所以可以直接写 `#type == "track"`。
# 被过滤掉的记录不会写入 dead_letter，是有意丢弃的。
#
# 示例：
# filterInclude:
#   - '#type == "track" && #event_name in ["login", "pay"]'
#   - '#type startsWith "user_"'
# filterExclude:
#   - 'debug == true'
#   - 'country == "CN" && level < 3'
filterInclude: []
filterExclude: []

# backfill: 从数数 OpenAPI 拉取历史数据并导入 MongoDB（仅在 mode=backfill 或
# `tango backfill` 子命令下生效）。
#
# 工作流：
#   按 $part_date 切分成"一天一个 SQL 任务"，每天 submit → poll → 分页拉取，
#   每页数据通过 lineCh 进入与 daemon/once 相同的 parse → filter → write
#   管线。所有 event 类型默认强制 $setOnInsert（forceSkipExisting=true），
#   保证回填不会覆盖线上已经存在的 #uuid。
#
# 续传：
#   进度（每天 / 每页）持久化到 Mongo 同库的 _backfill_progress 集合，按 runID
#   作主键。重启后跳过已完成的天，对 in_progress 的天检查 taskId 是否仍然
#   有效；taskId 失效则重新 submit，已写过的行依赖 #uuid unique 索引天然去重。
#
# 顶层的 filterInclude / filterExclude 会被同时编译成 Presto WHERE 下推到
# 数数侧，本地 expr filter 仍然兜底（除非 skipLocalFilter: true）。
backfill:
  # 数数 OpenAPI 网关；不要带尾斜杠
  apiBaseURL: ""

  # 数数项目的查询 token（每个项目一个）
  token: ""

  # 项目 ID，用于拼表名 v_event_<id> / v_user_<id>
  projectID: 0

  # 要查的表：event 或 user，默认 event
  table: "event"

  # 分区日期范围（按天分块；包含两端）
  partDateRange:
    start: "2026-01-01"
    end:   "2026-05-28"

  # 可选：每天内进一步用 #event_time 收窄（留空表示按整天取）
  # eventTimeRange:
  #   start: "2026-01-01 00:00:00"
  #   end:   "2026-05-28 23:59:59"

  # 每页行数，数数最小限制 1000，默认 10000
  pageSize: 10000

  # 任务状态轮询间隔
  pollInterval: "3s"
  # 单天任务从 submit 到 FINISHED 的最长等待时间
  pollTimeout: "30m"

  # 断点续传的标识；同一个 runID 重启即续跑
  runID: ""

  # checkpoint 集合名，默认 _backfill_progress
  progressCollection: "_backfill_progress"

  # 是否强制所有 event 写入都走 $setOnInsert，跳过已存在的 #uuid
  # 默认 true（回填语义就该幂等，不应覆盖线上后续修正）
  forceSkipExisting: true

  # 是否关闭本地 filter 兜底（关掉只信 SQL 下推）
  skipLocalFilter: false

# remoteConfig: 从 MongoDB 拉取一个 JSON 配置文档，逐字段覆盖本地 yaml
# （远程文档里没写的字段保留本地值）。用于让数据中心动态发布过滤规则，
# 各 tango 实例无需改本地文件、无需重启即可调整采集范围。
#
# 覆盖时机：
#   - 启动时：所有模式都会拉一次并 merge。
#   - 运行中：仅 daemon 模式每隔 syncInterval 再拉一次，且**只有 filter
#     （filterInclude/filterExclude）会热生效**；其余字段改动会记日志，
#     下次重启才生效。
#
# 不可被远程覆盖的字段（必须来自本地）：mongoURI、remoteConfig、mode
# —— 因为要先用本地 mongoURI 连上库，才能读到这份远程配置。
#
# 配置文档形如（_id 固定为 documentID）：
#   { "_id": "default",
#     "filterInclude": ["#type == \"track\" && #event_name == \"PaymentOrderState\"",
#                       "#type startsWith \"user_\""],
#     "filterExclude": [] }
remoteConfig:
  # 是否启用远程配置覆盖；false 时完全使用本地配置，不连库取配置
  enabled: false
  # 存放配置文档的集合名，默认 _tango_config
  collection: "_tango_config"
  # 全局共享的单一配置文档 _id，默认 default
  documentID: "default"
  # daemon 模式重新拉取并热更 filter 的间隔，默认 1h
  syncInterval: "1h"

# instanceID: 本进程唯一标识，来自环境变量 TANGO_INSTANCE_ID。
# agent 模式必填（用于定向任务与心跳注册），其他模式忽略。不在 yaml 里写，
# 部署时设环境变量：export TANGO_INSTANCE_ID=prod-agent-A

# agent: 任务 worker 模式（mode=agent 或 `tango agent` 子命令）。
# 长驻进程：注册心跳 → 从共享的 MongoDB 任务队列认领任务 → 执行（backfill/sql）
# → 执行期间续租 → 汇报结果。
#
# pull 模型，无中心调度、不靠心跳保证正确性：
#   - 任务是 _tango_tasks 集合里的文档，带可选 target（实例ID）。
#     target 空=任意 agent 可执行；非空=只有该实例能执行。
#   - agent 用原子 findOneAndUpdate 认领（pending→claimed + 盖租约），
#     保证同一任务不被两个 agent 同时执行。
#   - 长任务定期续租；agent 崩了租约过期，任务被别的 agent 回收重做
#     （#uuid/#user_id upsert 保证重做幂等）。这取代了"靠心跳判活"。
#   - _tango_instances 心跳注册（TTL 索引自动过期）只用于：定向发布时
#     fail-fast（目标不在线就拒绝发布）和运维查看在线列表，不影响认领正确性。
#
# 作用域：任务/配置都按 db 隔离——只影响连同一个 db 的 tango 进程，
# 不同 db 是各自独立的命名空间。
#
# TA 连接信息（apiBaseURL/token/proxy/projectID/schemaPrefix）由上面的 backfill
# 配置块提供；任务 payload 只说"取什么"（table/range 或显式 sql）。
agent:
  # 任务队列集合名，默认 _tango_tasks
  tasksCollection: "_tango_tasks"
  # 实例心跳注册集合名，默认 _tango_instances
  instancesCollection: "_tango_instances"
  # 轮询认领任务的间隔，默认 10s
  pollInterval: "10s"
  # 任务租约时长；超时未续租则可被其他 agent 回收，默认 5m
  leaseDuration: "5m"
  # 心跳刷新间隔，默认 30s
  heartbeatInterval: "30s"
  # 实例 TTL：心跳超过此时长视为离线，默认 90s
  instanceTTL: "90s"
