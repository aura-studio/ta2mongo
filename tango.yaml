# tango 配置文件

# mode: 运行模式 (daemon / once / ingest）
mode: "daemon"

# MongoDB 连接 URI
mongoURI: "mongodb://localhost:27017/tango"

# 日志级别：debug / info / warn / error
logLevel: "info"

# 日志文件匹配正则（daemon/once 模式使用）
logPattern: ["/var/log/ta.*.log"]

# 目标批量大小；min=batchSize/4, max=batchSize*2 自动推导
batchSize: 1000

# 并行写入 worker 数
batchWorkers: 2

# 批量定时刷新间隔
flushInterval: "1s"

# 文件重扫间隔，daemon 模式使用（如 "30s"、"1m"）
rescanInterval: "30s"

# 单次 bulk write 最大重试总时间
maxElapsedTime: "10s"

# 文件追踪模式：hybrid（默认）/ poll / event
# hybrid — 事件驱动为主 + 轮询兜底，兼顾低延迟与可靠性
# poll   — 纯轮询（每 200ms），不依赖系统通知，不会卡住
# event  — 纯事件驱动（kqueue/inotify），延迟最低但可能因通知丢失而卡死
tailMode: "hybrid"
