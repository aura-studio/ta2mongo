# tango 配置文件
#
# 优先级（从低到高）：内置默认值 < 此文件 < 环境变量（TANGO_* 前缀）< 命令行参数
#
# 环境变量示例：
#   TANGO_MONGOURI=mongodb://localhost:27017/tango
#   TANGO_LOGLEVEL=debug
#   TANGO_BATCHWORKERS=4

# mode: 运行模式，也可直接使用子命令（tango daemon / once / ingest）
# 可选值：daemon（默认）/ once / ingest
mode: "daemon"

mongoURI: "mongodb://localhost:27017/tango"

# logPattern: 日志文件匹配正则（daemon/once 模式使用）
logPattern:
  - "/var/log/ta.*.log"

rescanInterval: "30s"   # 文件重扫间隔，daemon 模式使用（如 "30s"、"1m"）

batchSize: 1000         # 目标批量大小；min=batchSize/4, max=batchSize*2 自动推导
batchWorkers: 2         # 并行写入 worker 数
flushInterval: "1s"     # 批量定时刷新间隔

maxElapsedTime: "10s"   # 单次 bulk write 最大重试总时间

logLevel: "info"        # 日志级别：debug / info / warn / error
