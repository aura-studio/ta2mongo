# agent.yaml — `tango daemon agent` 全量配置样例（含每个字段说明）。
#
# 启动：
#   tango daemon agent                            # 默认在二进制同级目录找 agent.{yaml,yml,json}
#   tango daemon agent --config /etc/tango/agent.yaml --instanceID node-1
#
# agent = 在上报之上额外开启两件事（由子命令决定，无需配置开关）：
#   ① 配置同步：定期从 report.remoteConfig 指定的文档拉取并热重载上报 filter；
#   ② 任务派发：注册心跳、轮询任务队列、原子领取并执行 report-sync / backfill / sql 任务。
#
# 标注约定：
#   [required] 无默认值，必须提供，否则启动校验失败；
#   [optional] 省略即自动走默认值（括号内为默认值）。
# 所有键也可用 TANGO_* 环境变量覆盖（嵌套键 . → _，如 agent.instanceID → TANGO_AGENT_INSTANCEID）。

common:
  logging:
    level: info                  # [optional]（默认 info）日志级别：debug / info / warn / error
    format: text                 # [optional]（默认 text）日志编码：text / json
  mongo:
    uri: mongodb://localhost:27017/tango  # [required] MongoDB 连接串；数据库名取自 URI 路径
    maxElapsedTime: 10s          # [optional]（默认 10s）单次 bulk-write 的退避重试总时长上限
    connectTimeout: 10s          # [optional]（默认 10s）初次连接握手超时
    serverSelectionTimeout: 30s  # [optional]（默认 30s）选择可用节点的超时

report:
  source:
    logPattern:                  # [required] 至少一条 glob/正则，匹配要追尾的日志文件路径
      - '/var/log/ta/.*\.log'
    tailMode: hybrid             # [optional]（默认 hybrid）追尾策略：hybrid / poll / event
    rescanInterval: 30s          # [optional]（默认 30s）重新扫描新文件的间隔
    pollInterval: 200ms          # [optional]（默认 200ms）poll/hybrid 模式的轮询节奏
    maxLineBytes: 10485760       # [optional]（默认 10485760 = 10MB）单行最大字节
  pipeline:
    batchSize: 1000              # [optional]（默认 1000）单次 bulk-write 目标条数
    batchSizeMin: 0              # [optional]（默认 0 = 自动取 batchSize/4）自适应下限
    batchSizeMax: 0              # [optional]（默认 0 = 自动取 batchSize*2）自适应上限
    batchWorkers: 4              # [optional]（默认 2）并行写 worker 数
    flushInterval: 1s            # [optional]（默认 1s）未满批次的刷新间隔
    channelBuffer: 0             # [optional]（默认 0 = 自动取 batchSize*2）每 worker 通道缓冲
    deadLetterCap: 128           # [optional]（默认 128）每 worker 死信批容量
  filter:                        # 本地 filter 是“兜底初值”，远端配置文档拉取成功后会覆盖它
    include:                     # [optional]（默认 [] = 全部放行）OR 语义，命中其一即保留
      - '#type == "track"'
    exclude:                     # [optional]（默认 []）命中其一即丢弃（在 include 之后应用）
      - 'debug == true'
  remoteConfig:                  # 配置同步参数（agent 模式生效）。连接类字段永不可被远端覆盖
    collection: _tango_config    # [optional]（默认 _tango_config）配置文档所在集合
    documentID: default          # [optional]（默认 default）配置文档 _id
    syncInterval: 1h             # [optional]（默认 1h）重新拉取并热重载的间隔

agent:
  instanceID: node-1             # [required] 本实例唯一标识（数据库命名空间内唯一）；也可用 --instanceID 覆盖
  tasksCollection: _tango_tasks         # [optional]（默认 _tango_tasks）任务队列集合
  instancesCollection: _tango_instances # [optional]（默认 _tango_instances）实例心跳集合（TTL 过期）
  pollInterval: 10s              # [optional]（默认 10s）轮询可领取任务的间隔
  leaseDuration: 5m              # [optional]（默认 5m）领取后的租约时长，过期可被其他 agent 重领
  heartbeatInterval: 30s         # [optional]（默认 30s）心跳刷新间隔
  instanceTTL: 90s               # [optional]（默认 90s）心跳超过此时长即视为离线
