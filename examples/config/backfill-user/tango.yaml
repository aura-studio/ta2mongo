# 场景：历史回填 - 用户表（backfill, table=user）
# v_user_<projectID> 无 $part_date 分区，作为单一 chunk 全量同步。
# 行按 #user_id upsert（snapshot），重跑幂等。
mode: "backfill"

logging:
  level: "info"

mongo:
  uri: "mongodb://localhost:27017/tango"
  maxElapsedTime: "30s"

backfill:
  apiBaseURL: "https://api.lnk.events"
  token: ""                        # 建议环境变量注入
  proxy: "socks5://user:pass@proxy-host:1080"
  projectID: 35
  schemaPrefix: "ta"               # → FROM ta.v_user_35
  table: "user"
  # user 表无需 partDateRange
  pageSize: 50000                  # 大表用大页，配合服务端分页
  pageRetries: 3
  paginate: true
  pollInterval: "5s"
  pollTimeout: "60m"
  runID: "backfill-user-full"
  forceSkipExisting: true

  # 冒烟测试技巧：先加 limit 验证管线，再去掉跑全量
  # limit: 1000
