# cli.backfill.max.yaml — cli 角色 backfill 功能的全量配置（仅含该功能实际用到的段）。
#
# 启动：tango --config cli.backfill.max.yaml   （不读 stdin，数据来自 TA OpenAPI）
#
# backfill = 从 ThinkingData OpenAPI 按日期范围（或 user 表整表）拉历史数据：submit→poll→paginate，逐页处理。
# 每行（事件 v_event_<projectID> / 用户 v_user_<projectID>）编码成 TA JSON 行，推入内存中转源（source/mem），
# 由 Engine 上报链路消费：解析/过滤/identity/安全写全复用，与实时上报完全同路。事件注入 #type=track（#uuid $setOnInsert）；
# 用户行注入 #type=user_setOnce（默认，绝不覆盖）或 user_set，并由 #account_id/#distinct_id 解析出 tango 的 #user_id 落库。
# backfill 内部强制 process.mode=pipeline（fetch 生产 + pipeline 消费并发跑中转源），故此处 process.mode 仅为信息性。
# 无 checkpoint / 无断点续传：重跑直接重新拉取，幂等由写模型保证。
# 选择性：event 名走 backfill.events → SQL #event_name IN (...)；超出事件名的过滤用引擎的上报过滤器 parser.filter.include/exclude
# （expr-lang 表达式，作用在解析后的扁平记录上）——backfill 不再做 SQL WHERE 下推，也不再有 include/exclude 键。
# 实际用到：logging · dao · process · parser.filter · source.mem · backfill · role.cli；不读 gateway、daemon —— 故此处不列。
# 环境变量覆盖：键 . → _ 加 TANGO_ 前缀（backfill.token → TANGO_BACKFILL_TOKEN；[]string 用逗号分隔）。

logging:                          # internal/logging
  level: info                     # [optional]（默认 info）debug / info / warn / error
  format: text                    # [optional]（默认 text）text / json

dao:                              # internal/dao
  mongo:                          # internal/dao/mongo
    uri: mongodb://localhost:27017/tango  # [required] 写入目标库；库名取自 URI 路径
    connectTimeout: 10s           # [optional]（默认 10s）初次连接握手超时
    serverSelectionTimeout: 30s   # [optional]（默认 30s）选择可用节点超时
  store:                          # internal/dao/store
    maxElapsedTime: 10s           # [optional]（默认 10s）单次 bulk-write 退避重试总时长上限

parser:                           # internal/parser
  filter:                         # internal/parser/filter（引擎上报过滤器；backfill 行与实时行同样经过这里）
    include:                      # [optional] expr-lang include 规则（OR）；空=全放行。超出 backfill.events 的选择性放这里
      - '#type == "track"'
    exclude:                      # [optional] expr-lang exclude 规则；命中即丢。作用在解析后扁平记录（#type/#event_name/properties.*）
      - 'debug == true'

process:                          # internal/process（上传策略；backfill 内部强制 pipeline，此处为信息性）
  mode: pipeline                  # [optional]（默认 batch）single / batch / pipeline；backfill 运行时强制 pipeline
  batchSize: 1000                 # [optional]（默认 1000）single/batch 模式 bulk-write 批大小

source:                           # internal/source（backfill 只用内存中转源 mem；tailer/file 段不适用此功能）
  mem:                            # internal/source/mem（fetch 行推入此中转源，由强制 pipeline 消费）
    bufferSize: 2000              # [optional]（默认 2000）中转通道容量（行）：fetch 生产者超前 pipeline 多少行后阻塞（背压）

backfill:                         # internal/backfill（仅依赖 logging + cfgtree；不碰 dao/parser/process/source）
  apiBaseURL: https://ta.example.com   # [required] TA OpenAPI 基址（http:// 或 https://）
  token: your-ta-openapi-token         # [required] TA OpenAPI token（查询参数 token）
  proxy: ""                            # [optional]（默认直连）出网代理 http/https/socks5（含 user:pass）
  projectID: 35                        # [required] TA 项目 id（>0）
  table: event                         # [optional]（默认 event）event / user
  events:                              # [optional] 事件名白名单（event 表）→ SQL #event_name IN (...)
    - login
    - pay
  schemaPrefix: ""                     # [optional]（默认空）表名前的 schema 限定（如 ta.）
  userTimeColumn: "#update_time"       # [optional]（默认 #update_time，仅 user 表）映射成 #time 的 v_user 列；该列缺则回退合成时间戳。user 行还会按身份确定性合成 #uuid（talog 必需，v_user 无）
  eventTimeColumn: "#event_time"       # [optional]（默认 #event_time，仅 event 表）映射成 #time 的 v_event 列（数仓事件视图用 #event_time 非 #time）；该列缺则回退合成时间戳
  userOrderBy: ""                      # [optional]（仅 user 表）ORDER BY 子句（不含前缀），配 limit 取确定性 top-N，如 "last_login_time DESC" 取最近登录的 N 个用户；空=不排序
  userWhere: ""                        # [optional]（仅 user 表）WHERE 谓词（不含前缀），分布式编排取单分片用，如 mod(cast("#user_id" AS bigint)/4194304, 8) = 3；空=无谓词
  partDateRange:                       # [required]（event 表）分区日期闭区间 YYYY-MM-DD
    start: "2026-05-01"
    end: "2026-05-03"
  eventTimeRange:                      # [optional]（event 表）事件时间窗 YYYY-MM-DD HH:MM:SS
    start: "2026-05-01 00:00:00"
    end: "2026-05-03 23:59:59"
  limit: 0                             # [optional]（默认 0=不限）每天行数上限（冒烟用）
  pageSize: 10000                      # [optional]（默认 10000，最小 1000）TA 服务端分页大小（提交时定）
  paginate: true                       # [optional]（默认 true）false=不分页（整批一页）
  pageRetries: 3                       # [optional]（默认 3）单页失败重试次数
  pollInterval: 3s                     # [optional]（默认 3s）轮询任务状态间隔
  pollTimeout: 30m                     # [optional]（默认 30m）单任务轮询超时
  forceSkipExisting: true              # [optional]（默认 true）仅选 user 表 #type：true→user_setOnce（绝不覆盖），false→user_set；不影响事件表

role:                             # internal/role
  mode: cli                       # [required] 选择 cli 角色（默认是 daemon）
  cli:                            # internal/role/cli
    function: backfill            # [required] 切到 TA OpenAPI 历史回填（默认 upload）
