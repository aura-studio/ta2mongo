# cli.sql.max.yaml — cli 角色 sql 功能的全量配置（仅含该功能实际用到的段）。
#
# 启动：echo "SELECT * FROM event LIMIT 5" | tango --config cli.sql.max.yaml
#
# sql = 从 stdin 读一条 SQL，翻译成 MongoDB 操作执行后，把结果以 Extended-JSON（EJSON）写 stdout。
# 实际用到：logging · dao.mongo · role.cli。它直达 MongoDB，不走上报管道，
# 故不读 dao.store / parser / process / source / role.gateway / role.daemon —— 此处不列。
# SQL 由 vitess 解析，表名=集合名；操作的库取自连接 URI。语句示例见 queries.sample.sql。
# DocumentDB 不支持含表达式的 UPDATE（pipeline 形式），用常量赋值。
# 环境变量覆盖：键 . → _ 加 TANGO_ 前缀（dao.mongo.uri → TANGO_DAO_MONGO_URI）。

logging:                          # internal/logging
  level: info                     # [optional]（默认 info）debug / info / warn / error
  format: text                    # [optional]（默认 text）text / json

dao:                              # internal/dao
  mongo:                          # internal/dao/mongo
    uri: mongodb://localhost:27017/tango  # [required] MongoDB 连接串；SQL 操作的库取自 URI 路径
    connectTimeout: 10s           # [optional]（默认 10s）初次连接握手超时
    serverSelectionTimeout: 30s   # [optional]（默认 30s）选择可用节点超时

role:                             # internal/role
  mode: cli                       # [required] 选择 cli 角色（默认是 daemon）
  cli:                            # internal/role/cli
    function: sql                 # [required(本样例)]（默认 upload）upload / uploadfile / ejson / sql / config / configget
