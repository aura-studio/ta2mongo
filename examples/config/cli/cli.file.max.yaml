# cli.file.max.yaml — cli 角色 file 功能的全量配置（仅含该功能实际用到的段）。
#
# 启动：tango --config cli.file.max.yaml   （不读 stdin，输入来自 source.file.paths 列出的文件）
#
# file = 把已落盘的存量日志文件一次性灌入上报链路：逐文件从头读到 EOF，读完即止，统计 JSON 写 stdout。
# 仅接收显式文件路径：不支持 glob、不支持目录、不依赖 tailer。与 daemon 的边界：tailer 常驻追新增，file 有限导存量。
# 无 checkpoint/断点续传：重跑全量重导，幂等由写模型保证（event 按 uuid upsert、user 按 _ts 守卫）。
# 实际用到：logging · dao · parser · process · source.file · role.cli；
# 不读 source.tailer（不追尾）、role.gateway、role.daemon —— 故此处不列。
# 环境变量覆盖：键 . → _ 加 TANGO_ 前缀（source.file.paths → TANGO_SOURCE_FILE_PATHS，[]string 用逗号分隔）。

logging:                          # internal/logging
  level: info                     # [optional]（默认 info）debug / info / warn / error
  format: text                    # [optional]（默认 text）text / json

dao:                              # internal/dao
  mongo:                          # internal/dao/mongo
    uri: mongodb://localhost:27017/tango  # [required] MongoDB 连接串；库名取自 URI 路径
    connectTimeout: 10s           # [optional]（默认 10s）初次连接握手超时
    serverSelectionTimeout: 30s   # [optional]（默认 30s）选择可用节点超时
  store:                          # internal/dao/store
    maxElapsedTime: 10s           # [optional]（默认 10s）单次 bulk-write 退避重试总时长上限

parser:                           # internal/parser（上报 filter，作用于每行）
  filter:                         # internal/parser/filter
    include:                      # [optional]（默认 [] = 全放行）OR 语义命中其一即保留
      - '#type == "track"'
      - '#type == "user_set"'
    exclude:                      # [optional]（默认 []）命中其一即丢弃（在 include 之后）
      - 'debug == true'

process:                          # internal/process（上传策略处理参数）
  mode: batch                     # [optional]（默认 batch）single / batch / pipeline
  batchSize: 1000                 # [optional]（默认 1000）single/batch 模式 bulk-write 批大小
  pipeline:                       # internal/process/pipeline
    batchSize: 1000               # [optional]（默认 1000）单次 bulk-write 目标条数
    batchSizeMin: 0               # [optional]（默认 0 = 自动 batchSize/4）自适应下限
    batchSizeMax: 0               # [optional]（默认 0 = 自动 batchSize*2）自适应上限
    batchWorkers: 2               # [optional]（默认 2）并行写 worker 数
    flushInterval: 1s             # [optional]（默认 1s）未满批次刷新间隔
    channelBuffer: 0              # [optional]（默认 0 = 自动 batchSize*2）每 worker 通道缓冲
    deadLetterCap: 128            # [optional]（默认 128）每 worker 死信批容量

source:                           # internal/source
  file:                           # internal/source/file（一次性文件导入源；显式路径，无 glob/目录）
    paths:                        # [required] 显式文件路径列表（逐文件读到 EOF；目录会被跳过，不展开）
      - /var/log/app/ta.2024-01-01.log
      - /var/log/app/ta.2024-01-02.log
    maxLineBytes: 10485760        # [optional]（默认 10485760 = 10MB）单行最大字节；
                                  # 超限行所在文件剩余部分跳过，其余文件继续导入

role:                             # internal/role
  mode: cli                       # [required] 选择 cli 角色（默认是 daemon）
  cli:                            # internal/role/cli
    function: file                # [required] 切到存量文件导入（默认 upload）upload / file / ejson / sql / config / configget
