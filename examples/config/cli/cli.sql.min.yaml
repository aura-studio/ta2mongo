# cli.sql.min.yaml — `echo "SELECT ..." | tango --config cli.sql.min.yaml` 最精简配置：只含 required 字段。
# 其余字段全部走默认值（详见同目录 cli.sql.max.yaml 的逐字段说明）。
# 运行角色由 role.mode 选择；cli 必须显式指定。role.cli.function 默认是 upload，跑 sql 必须显式设为 sql。
# SQL 表名=集合名；操作的库取自 dao.mongo.uri 路径。
role:
  mode: cli                                # [required] daemon / gateway / cli
  cli:
    function: sql                          # [required] 切到 SQL Data API（不写则默认 upload）
dao:
  mongo:
    uri: mongodb://localhost:27017/tango   # [required]；SQL 操作的库取自该 URI 路径
