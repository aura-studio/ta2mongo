# cli.ejson.max.yaml — 全量配置参考（统一 schema 的全部 6 个段，逐字段说明）。
#
# 启动：echo '{"action":"find","collection":"event","filter":{},"limit":5}' | tango --config cli.ejson.max.yaml
#
# cli + role.cli.function=ejson = 一次性从 stdin 读一个 Extended-JSON（EJSON）Mongo Data API
# 请求，执行后把 EJSON 响应写 stdout（gateway POST /ejson 的控制台等价）。它只用
# logging/dao 共享段 + role.cli 专属段；parser / process / source 段对 ejson 功能无效（仅 schema 对称保留）。
# 完全放开：任意 database/collection、任意 filter/operator/pipeline，无上限。请求示例见 requests.sample.ejson。
#
# tango 配置是统一 schema：键路径 = internal/ 下的包路径。6 个段：logging · dao · parser · source · process · role。
# 标注：[required] 必填；[required:daemon] 仅 daemon 必填；其余 [optional]（括号内默认值）。
# 环境变量覆盖：键 . → _ 加 TANGO_ 前缀（dao.mongo.uri → TANGO_DAO_MONGO_URI）。

logging:                          # internal/logging
  level: info                     # [optional]（默认 info）debug / info / warn / error
  format: text                    # [optional]（默认 text）text / json

dao:                              # internal/dao
  mongo:                          # internal/dao/mongo
    uri: mongodb://localhost:27017/tango  # [required] MongoDB 连接串；ejson 请求缺省的库取自 URI 路径
    connectTimeout: 10s           # [optional]（默认 10s）初次连接握手超时
    serverSelectionTimeout: 30s   # [optional]（默认 30s）选择可用节点超时
  store:                          # internal/dao/store
    maxElapsedTime: 10s           # [optional]（默认 10s）单次 bulk-write 退避重试总时长上限（ejson 不走 bulk，故无效）

parser:                           # internal/parser（上报 filter；ejson 功能忽略）
  filter:                         # internal/parser/filter
    include: []                   # [optional]（默认 [] = 全放行）
    exclude: []                   # [optional]（默认 []）

source:                           # internal/source（daemon 的文件来源；ejson 忽略）
  tailer:                         # internal/source/tailer
    logPattern:                   # [required:daemon] daemon 必填；cli/ejson 忽略
      - '/var/log/ta/.*\.log'
    tailMode: hybrid              # [optional]（默认 hybrid）hybrid / poll / event
    rescanInterval: 30s           # [optional]（默认 30s）
    pollInterval: 200ms           # [optional]（默认 200ms）
    maxLineBytes: 10485760        # [optional]（默认 10485760 = 10MB）

process:                          # internal/process（上传策略；ejson 功能忽略）
  mode: batch                     # [optional]（默认 batch）single / batch / pipeline
  batchSize: 1000                 # [optional]（默认 1000）
  pipeline:                       # internal/process/pipeline
    batchSize: 1000               # [optional]（默认 1000）
    batchSizeMin: 0               # [optional]（默认 0 = 自动 batchSize/4）
    batchSizeMax: 0               # [optional]（默认 0 = 自动 batchSize*2）
    batchWorkers: 2               # [optional]（默认 2）
    flushInterval: 1s             # [optional]（默认 1s）
    channelBuffer: 0              # [optional]（默认 0 = 自动 batchSize*2）
    deadLetterCap: 128            # [optional]（默认 128）

role:                             # internal/role
  mode: cli                       # [optional]（默认 daemon）daemon / gateway / cli
  daemon: {}                      # internal/role/daemon —— daemon 专属（暂无字段）
  gateway:                        # internal/role/gateway —— gateway 专属（cli 忽略）
    addr: ":8080"                 # [optional]（默认 :8080）HTTP 监听地址
  cli:                            # internal/role/cli —— cli 角色专属配置
    function: ejson               # [required(本样例)]（默认 upload）upload（stdin 日志上报）/ ejson（Mongo Data API）
