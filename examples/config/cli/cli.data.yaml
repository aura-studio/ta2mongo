# cli.data.yaml — `tango --config cli.data.yaml` 运行 cli 角色的 Mongo Data API 功能。
# 从 stdin 读一个 Extended-JSON 请求，执行后把 Extended-JSON 响应写到 stdout
# （等价于 gateway 的 POST /data）。
#
#   echo '{"action":"find","collection":"event","filter":{},"limit":5}' \
#     | tango --config cli.data.yaml
#
# 这是完全放开的接口：任意 database/collection、任意 filter/operator/pipeline，无上限。
role:
  mode: cli                                # [required] 选择 cli 角色（默认是 daemon）
  cli:
    function: data                         # upload（默认，stdin 日志上报）| data（Mongo Data API）
dao:
  mongo:
    uri: mongodb://localhost:27017/tango   # [required]；缺省的库名取自该 URI 路径
