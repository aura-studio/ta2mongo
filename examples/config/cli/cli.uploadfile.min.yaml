# cli.uploadfile.min.yaml — `tango --config cli.uploadfile.min.yaml` 最精简配置：只含 required 字段。
# 其余字段全部走默认值（详见同目录 cli.uploadfile.max.yaml 的逐字段说明）。
# 运行角色由 role.mode 选择；cli 必须显式指定。role.cli.function 默认是 upload，跑 uploadfile 必须显式设为 uploadfile。
# uploadfile = 把 source.uploadfile.logPattern 匹配到的存量日志文件一次性灌入上报链路（读到 EOF 即止，不读 stdin）。
# 无 checkpoint/断点续传：重跑全量重导，幂等由写模型保证（event 按 uuid upsert、user 按 _ts 守卫）。
role:
  mode: cli                                # [required] daemon / gateway / cli
  cli:
    function: uploadfile                   # [required] 切到存量文件导入（不写则默认 upload）
dao:
  mongo:
    uri: mongodb://localhost:27017/tango   # [required]
source:
  uploadfile:
    logPattern:                            # [required] glob（支持 ** 与跨平台路径），匹配要导入的存量文件
      - /var/log/app/ta.*.log
