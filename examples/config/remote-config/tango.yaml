# 场景：远程配置控制面（daemon + remoteConfig）
# 各 daemon 实例启动时从 MongoDB 拉一份配置文档逐字段覆盖本地；运行中每
# syncInterval 再拉一次，仅 filter 热生效（无需重启即可调整采集范围）。
#
# 数据中心用 client 发布（见 examples/client）：
#   cli.PublishFilter(ctx, []string{`#type startsWith "user_"`}, nil)
# 发布的文档形如：
#   { "_id": "default", "filter": { "include": [...], "exclude": [] } }
#
# 作用域按 db 隔离：只影响连同一个 db 的实例。
mode: "daemon"

logging:
  level: "info"

mongo:
  uri: "mongodb://localhost:27017/tango"

source:
  logPattern:
    - "/var/log/ta/*.log"
  tailMode: "hybrid"

pipeline:
  batchSize: 1000
  batchWorkers: 2

# 本地 filter 作为初始/兜底值；远程文档存在时会覆盖
filter:
  include:
    - '#type startsWith "user_"'

remoteConfig:
  enabled: true
  collection: "_tango_config"
  documentID: "default"
  syncInterval: "1h"
