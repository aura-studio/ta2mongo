# 场景：任务 worker（agent）
# 长驻进程：注册心跳 → 从 _tango_tasks 认领任务 → 执行 backfill/sql →
# 续租 → 汇报。定向任务靠 TANGO_INSTANCE_ID 匹配。
#
# 启动（instanceID 必须用环境变量）：
#   TANGO_INSTANCE_ID=prod-agent-A tango agent --config tango.yaml
mode: "agent"

logging:
  level: "info"

mongo:
  uri: "mongodb://localhost:27017/tango"
  maxElapsedTime: "30s"

# agent 执行 backfill/sql 任务时复用这里的 TA 连接信息；
# 任务 payload 只携带"取什么"（table / 日期范围 / 显式 SQL）。
backfill:
  apiBaseURL: "https://api.lnk.events"
  token: ""                        # TANGO_BACKFILL_TOKEN 注入更安全
  proxy: "socks5://user:pass@proxy-host:1080"
  projectID: 35
  schemaPrefix: "ta"
  pageSize: 50000
  pageRetries: 3
  paginate: true
  pollTimeout: "60m"

agent:
  tasksCollection: "_tango_tasks"
  instancesCollection: "_tango_instances"
  pollInterval: "10s"
  leaseDuration: "5m"
  heartbeatInterval: "30s"
  instanceTTL: "90s"
