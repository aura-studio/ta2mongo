# tango report run --config report.yaml
#
# Report service: tail TA logs, filter, resolve identity, write to MongoDB.
# Unified role-config schema (Phase 4): runtime + report + remoteConfig.
runtime:
  logging:
    level: info
    format: text
  mongo:
    uri: "mongodb://localhost:27017/tango"
    maxElapsedTime: 30s

report:
  source:
    logPattern:
      - "/var/log/ta/.*\\.log"
    tailMode: hybrid
  pipeline:
    batchSize: 1000
    batchWorkers: 4
  filter:
    include:
      - '#type == "track"'
    exclude: []

# Optional control-plane filter hot-reload. Disabled here; the report service
# keeps its local filter. Enable to watch the remote-config document instead.
remoteConfig:
  enabled: false
  collection: _tango_config
  documentID: default
  syncInterval: 30s
