# daemon.yaml — tango daemon role.
#
# Run mode is chosen by the subcommand (NOT a field in this file):
#   tango daemon standalone --config daemon.yaml   # report only, local filter
#   tango daemon agent      --config daemon.yaml   # report + sync + tasks
#
# The config has three parts:
#   common — process-wide: logging + the MongoDB connection (both modes).
#   report — the reporting pipeline (tail → parse → filter → write). Used by
#            both modes. The remoteConfig sub-block is consulted ONLY in agent
#            mode (standalone keeps the local filter verbatim).
#   agent  — task-agent settings; used ONLY in agent mode. instanceID is
#            required in agent mode (also settable via --instanceID /
#            TANGO_AGENT_INSTANCEID).
#
# YAML and JSON are both supported (the file extension selects the parser).
# Every key can also be set via a TANGO_* environment variable (nested key with
# "." → "_", e.g. common.mongo.uri → TANGO_COMMON_MONGO_URI), and a few via CLI
# flags (--mongoURI, --logLevel, --instanceID).

common:
  logging:
    level: info
    format: text
  mongo:
    uri: mongodb://localhost:27017/tango
    maxElapsedTime: 10s

# Reporting pipeline: tail logPattern files, apply the report filter, write to
# Mongo. Expressions run against the flattened record, so #type / #event_name /
# properties.* are all addressable. logPattern is required.
report:
  source:
    logPattern:
      - '/var/log/ta/.*\.log'
    tailMode: hybrid
    rescanInterval: 30s
  pipeline:
    batchSize: 1000
    batchWorkers: 4
    flushInterval: 1s
  filter:
    include:
      - '#type == "track"'
      - '#type == "user_set"'
    exclude:
      - 'debug == true'
  # remoteConfig (agent mode only): a control plane pushes the reporting filter;
  # report-sync tasks write this document, and the agent hot-reloads it on the
  # interval. Ignored in standalone mode.
  remoteConfig:
    collection: _tango_config
    documentID: default
    syncInterval: 1h

# Agent settings (agent mode only). instanceID uniquely identifies this agent
# within the database namespace; required in agent mode.
agent:
  instanceID: daemon-node-1
  pollInterval: 10s
  leaseDuration: 5m
  heartbeatInterval: 30s
  instanceTTL: 90s
