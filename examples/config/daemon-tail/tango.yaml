# 场景：实时日志采集（daemon）
# tail 匹配的日志文件，解析 TA 记录，过滤后持续写入 MongoDB。
mode: "daemon"

logging:
  level: "info"
  format: "text"

mongo:
  uri: "mongodb://localhost:27017/tango"
  maxElapsedTime: "10s"

source:
  logPattern:
    - "/var/log/ta/*.log"
    - "/data/app/**/event-*.log"   # ** 递归匹配子目录
  tailMode: "hybrid"               # 事件驱动 + 轮询兜底
  rescanInterval: "30s"
  pollInterval: "200ms"
  maxLineBytes: 10485760

pipeline:
  batchSize: 2000                  # 高吞吐场景调大
  batchWorkers: 4
  flushInterval: "1s"
  channelBuffer: 8000

# 只采集登录/支付事件和所有 user_* 记录；丢弃压测流量
filter:
  include:
    - '#type startsWith "user_"'
    - '#type == "track" && #event_name in ["login", "pay", "PaymentOrderState"]'
  exclude:
    - 'properties.is_loadtest == true'
