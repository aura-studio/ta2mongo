# tango gateway serve --config gateway.yaml --addr :8080
#
# HTTP gateway service: exposes ingest / upload / backfill / sql / publish over
# REST on top of a connected client SDK. Unified role-config schema (Phase 4).
runtime:
  logging:
    level: info
    format: text
  mongo:
    uri: "mongodb://localhost:27017/tango"
    maxElapsedTime: 30s

gateway:
  addr: ":8080"

upload:
  string:
    batchSize: 1000
  file:
    logPattern:
      - "/var/log/ta/.*\\.log"
    checkpointCollection: _tango_fileupload

# Task queue used by the /publish/* routes.
tasks:
  collection: _tango_tasks
  instancesCollection: _tango_instances

backfillFilter:
  table: event
