# gateway.max.yaml — `tango gateway` 全量配置（含每个字段说明）。
#
# 启动：tango gateway --config gateway.max.yaml --addr :8080
#
# gateway = 常驻 HTTP 服务，暴露单个 /upload REST 接口（请求体携带日志数组 +
# 可选 mode：single/batch/pipeline），底层把请求体包成 httpbody 源后复用 api 引擎。
#
# 配置结构与 internal/ 包层级一致：共享模块（logging/dao/parser/process）在顶层，
# 角色专属配置在 role.gateway。gateway 的上传处理直接复用顶层 process.* 与
# parser.filter.*，不在角色下重复定义。
#
# 标注：[required] 无默认值必须提供；[optional] 省略即走默认值（括号内为默认值）。
# 环境变量覆盖如 dao.mongo.uri → TANGO_DAO_MONGO_URI、role.gateway.addr → TANGO_ROLE_GATEWAY_ADDR。

logging:                          # internal/logging
  level: info                     # [optional]（默认 info）debug / info / warn / error
  format: text                    # [optional]（默认 text）text / json

dao:                              # internal/dao
  mongo:                          # internal/dao/mongo
    uri: mongodb://localhost:27017/tango  # [required] MongoDB 连接串；库名取自 URI 路径
    connectTimeout: 10s           # [optional]（默认 10s）初次连接握手超时
    serverSelectionTimeout: 30s   # [optional]（默认 30s）选择可用节点超时
  store:                          # internal/dao/store
    maxElapsedTime: 10s           # [optional]（默认 10s）单次 bulk-write 退避重试总时长上限

parser:                           # internal/parser（上传时作用于每行的上报 filter）
  filter:                         # internal/parser/filter
    include: []                   # [optional]（默认 [] = 全放行）
    exclude: []                   # [optional]（默认 []）

process:                          # internal/process（上传策略的处理参数）
  batchSize: 1000                 # [optional]（默认 1000）single/batch 模式 bulk-write 批大小
  pipeline:                       # internal/process/pipeline（pipeline 模式的异步 worker 池）
    batchSize: 1000               # [optional]（默认 1000）目标批大小
    batchWorkers: 2               # [optional]（默认 2）并发写 worker 数
    flushInterval: 1s             # [optional]（默认 1s）部分批刷新间隔
    deadLetterCap: 128            # [optional]（默认 128）每 worker 死信批容量

role:                             # internal/role
  gateway:                        # internal/role/gateway（仅 gateway 专属：监听地址 + 默认策略）
    addr: ":8080"                 # [optional]（默认 :8080）HTTP 监听地址；--addr 覆盖
    defaultMode: batch            # [optional]（默认 batch）请求未带 mode 时的策略：single/batch/pipeline
