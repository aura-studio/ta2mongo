# cluster.max.yaml — `tango daemon cluster` 全量配置（含每个字段说明）。
#
# 启动：tango daemon cluster --config cluster.max.yaml
#
# cluster = 在 standalone 上报的基础上，额外从 MongoDB 控制面文档拉取并热重载上报 filter：
#   - report.filter.local  是本地兜底规则；
#   - report.filter.remote 指定控制面文档（集合 / _id / 同步间隔），启动时拉取一次、
#     之后每 syncInterval 再拉取，命中变更即热替换 filter（无需重启）。
#   连接类字段（generic.mongo.uri 等）永不可被远端覆盖。
#
# 标注：[required] 无默认值必须提供；[optional] 省略即走默认值（括号内为默认值）。
# 所有键也可用 TANGO_* 环境变量覆盖（嵌套键 . → _，如 generic.mongo.uri → TANGO_GENERIC_MONGO_URI）；
# 命令行用完整层级名 flag 覆盖，如 --generic.mongo.uri。

generic:
  logging:
    level: info                  # [optional]（默认 info）debug / info / warn / error
    format: text                 # [optional]（默认 text）text / json
  mongo:
    uri: mongodb://localhost:27017/tango  # [required] MongoDB 连接串；库名取自 URI 路径
    maxElapsedTime: 10s          # [optional]（默认 10s）单次 bulk-write 退避重试总时长上限
    connectTimeout: 10s          # [optional]（默认 10s）初次连接握手超时
    serverSelectionTimeout: 30s  # [optional]（默认 30s）选择可用节点超时

report:
  source:
    logPattern:                  # [required] 至少一条 glob/正则，匹配要追尾的日志文件路径
      - '/var/log/ta/.*\.log'
    tailMode: hybrid             # [optional]（默认 hybrid）hybrid / poll / event
    rescanInterval: 30s          # [optional]（默认 30s）重新扫描新文件的间隔
    pollInterval: 200ms          # [optional]（默认 200ms）poll/hybrid 轮询节奏
    maxLineBytes: 10485760       # [optional]（默认 10485760 = 10MB）单行最大字节
  pipeline:
    batchSize: 1000              # [optional]（默认 1000）单次 bulk-write 目标条数
    batchSizeMin: 0              # [optional]（默认 0 = 自动 batchSize/4）自适应下限
    batchSizeMax: 0              # [optional]（默认 0 = 自动 batchSize*2）自适应上限
    batchWorkers: 4              # [optional]（默认 2）并行写 worker 数
    flushInterval: 1s            # [optional]（默认 1s）未满批次刷新间隔
    channelBuffer: 0             # [optional]（默认 0 = 自动 batchSize*2）每 worker 通道缓冲
    deadLetterCap: 128           # [optional]（默认 128）每 worker 死信批容量
  filter:
    local:                       # 本地 filter（兜底初值，远端拉取成功后被覆盖）
      include:                   # [optional]（默认 [] = 全放行）OR 语义命中其一即保留
        - '#type == "track"'
      exclude:                   # [optional]（默认 []）命中其一即丢弃（在 include 之后）
        - 'debug == true'
    remote:                      # 控制面配置同步（cluster 模式生效）
      collection: _tango_config  # [optional]（默认 _tango_config）配置文档所在集合
      documentID: default        # [optional]（默认 default）配置文档 _id
      syncInterval: 1h           # [optional]（默认 1h）重新拉取并热重载的间隔
