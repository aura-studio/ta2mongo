# cluster.min.yaml — `tango daemon cluster` 最精简配置：只含 required 字段。
# 其余字段（含 report.filter.remote 控制面参数）全部走默认值，详见同目录 cluster.max.yaml。
# 控制面集合/文档/同步间隔默认为 _tango_config / default / 1h。
generic:
  mongo:
    uri: mongodb://localhost:27017/tango   # [required]
report:
  source:
    logPattern:                            # [required]
      - '/var/log/ta/.*\.log'
