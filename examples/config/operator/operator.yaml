# tango operator <ingest|upload|backfill|sql|publish ...> --config operator.yaml
#
# Operator CLI: one-shot operations for humans, scripts, and CI/CD. Unified
# role-config schema (Phase 4): runtime + upload + backfill + tasks (publish).
runtime:
  logging:
    level: info
    format: text
  mongo:
    uri: "mongodb://localhost:27017/tango"
    maxElapsedTime: 30s

upload:
  string:
    batchSize: 1000
    filter:
      include: []
      exclude: []
  file:
    logPattern:
      - "/var/log/ta/.*\\.log"
    checkpointCollection: _tango_fileupload

# Backfill / ad-hoc SQL execution (operator backfill / sql) and selection.
backfill:
  apiBaseURL: ""
  token: ""
  projectID: 0
backfillFilter:
  table: event

# Task queue used by `operator publish ...`.
tasks:
  collection: _tango_tasks
  instancesCollection: _tango_instances
