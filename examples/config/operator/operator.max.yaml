# operator.max.yaml — `tango operator <subcmd>` 全量配置（含每个字段说明）。
#
# 启动（一次性操作，举例）：
#   tango operator ingest   --config operator.max.yaml '{"#type":"track",...}'
#   tango operator upload   --config operator.max.yaml
#   tango operator backfill --config operator.max.yaml
#   tango operator sql      --config operator.max.yaml 'SELECT ...'
#   tango operator publish report-sync --config operator.max.yaml --include '#type == "track"'
#
# 标注：[required] 无默认值必须提供；[optional] 省略即走默认值（括号内为默认值）。
# backfill 段仅在 `operator backfill` / `operator sql` 直接执行时使用，逐字段 required
# 只在该命令运行时校验；其余命令可留占位值。

runtime:
  logging:
    level: info                  # [optional]（默认 info）debug / info / warn / error
    format: text                 # [optional]（默认 text）text / json
  mongo:
    uri: mongodb://localhost:27017/tango  # [required] MongoDB 连接串；库名取自 URI 路径
    maxElapsedTime: 10s          # [optional]（默认 10s）单次 bulk-write 退避重试总时长上限
    connectTimeout: 10s          # [optional]（默认 10s）初次连接握手超时
    serverSelectionTimeout: 30s  # [optional]（默认 30s）选择可用节点超时

upload:
  string:
    batchSize: 1000              # [optional]（默认 1000）ingest 批大小
    filter:
      include: []                # [optional]（默认 []）字符串上报 include
      exclude: []                # [optional]（默认 []）字符串上报 exclude
  file:
    logPattern:                  # [optional]（默认 []）upload 默认文件模式；--logPattern 覆盖
      - '/var/log/ta/.*\.log'
    maxLineBytes: 10485760       # [optional]（默认 10485760 = 10MB）单行最大字节
    filter:
      include: []                # [optional]（默认 []）文件上报 include
      exclude: []                # [optional]（默认 []）文件上报 exclude
    checkpointCollection: _tango_fileupload  # [optional]（默认 _tango_fileupload）断点续传集合

# 历史回填执行参数（operator backfill / sql 直接执行时读取）。
backfill:
  apiBaseURL: "https://ta-receiver.example.com"  # [required for backfill] OpenAPI 网关，无尾斜杠
  token: "your-project-token"    # [required for backfill] 项目查询 token
  projectID: 35                  # [required for backfill] 拼表名 v_event_<id> / v_user_<id>
  runID: "backfill-2026-01"      # [required for backfill] 断点续传标识
  partDateRange:
    start: "2026-01-01"          # [required for event 表] YYYY-MM-DD
    end: "2026-01-07"            # [required for event 表] YYYY-MM-DD
  pageSize: 10000                # [optional]（默认 10000，≥1000）服务端分页大小
  paginate: true                 # [optional]（默认 true）true=分页续传 / false=单次全量流式
  pollInterval: 3s               # [optional]（默认 3s）任务状态轮询间隔
  pollTimeout: 30m               # [optional]（默认 30m）单 chunk submit→FINISHED 最长等待
  pageRetries: 3                 # [optional]（默认 3）单页瞬时错误重试次数
  progressCollection: _backfill_progress  # [optional]（默认 _backfill_progress）续传检查点集合
  forceSkipExisting: true        # [optional]（默认 true）event 一律 $setOnInsert 跳过已存在 #uuid
  skipLocalFilter: false         # [optional]（默认 false）true=只信 SQL 下推
  proxy: ""                      # [optional]（默认 ""）http/https/socks5；空=直连
  schemaPrefix: ""               # [optional]（默认 ""）表名前缀，如 ta → ta.v_event_35
  limit: 0                       # [optional]（默认 0）>0 时每条 SQL 追加 LIMIT n（冒烟用）

# 回填选表与谓词。
backfillFilter:
  table: event                   # [optional]（默认 event）event / user
  events: []                     # [optional]（默认 []）event 表语法糖 → #event_name in [...]
  include: []                    # [optional]（默认 []）下推 + 本地兜底
  exclude: []                    # [optional]（默认 []）

# 临时 SQL 执行覆盖。
sql:
  schemaPrefix: ""               # [optional]（默认 ""）operator sql 的 schema 前缀覆盖

# operator publish ... 发布到的任务队列。
tasks:
  collection: _tango_tasks       # [optional]（默认 _tango_tasks）任务队列集合
  instancesCollection: _tango_instances  # [optional]（默认 _tango_instances）实例心跳集合
  instanceTTL: 90s               # [optional]（默认 90s）目标实例在线判定 TTL
