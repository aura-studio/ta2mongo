# client.yaml — tango client (operator/SDK role).
# Run with: tango <subcommand> --config client.yaml   (cli face)
#       or: tango serve --config client.yaml           (http/rest face)
#       or: import rocket-nano/tools/tango/client       (library face)
#
# Functionality is partitioned into five independently-configured sections.
# instanceID is NOT a client concept (it belongs to the daemon's agent).

logging:
  level: info

mongo:
  uri: mongodb://localhost:27017/tango
  maxElapsedTime: 10s

# 1) String single upload (no retransmission).
stringUpload:
  batchSize: 1000
  filter:
    include: []
    exclude: []

# 2) File single upload (with resume/retransmission via a per-file checkpoint).
fileUpload:
  logPattern:
    - '/var/log/ta/.*\.log'
  maxLineBytes: 10485760
  checkpointCollection: _tango_fileupload
  pipeline:
    batchSize: 1000
  filter:
    include: []
    exclude: []

# 3) Backfill execution (connection/credentials).
backfill:
  apiBaseURL: https://ta-receiver.example.com
  token: YOUR_TA_TOKEN
  projectID: 102
  partDateRange:
    start: "2026-05-01"
    end: "2026-05-07"
  runID: backfill-2026-05
  pageSize: 10000

# Backfill selection filter — table + event/property predicates, never #type.
# The table lives here, not as a standalone backfill field.
backfillFilter:
  table: event
  events:
    - PaymentOrderState
    - login
  include: []
  exclude: []

# 4) Ad-hoc SQL execution (reuses backfill credentials; table from backfillFilter).
sql:
  schemaPrefix: ""

# 5) MongoDB task publishing — the publish end of the agent task mechanism.
publish:
  tasksCollection: _tango_tasks
  instancesCollection: _tango_instances
  instanceTTL: 90s

# HTTP/REST face.
server:
  addr: ":8080"
