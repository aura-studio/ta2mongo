# 场景：历史回填 - 事件表（backfill, table=event）
# 从数数 OpenAPI 按 $part_date 分天拉取 v_event_<projectID>，经 socks5 代理，
# 过滤后写入 MongoDB。filter 同时下推为 Presto WHERE。
mode: "backfill"

logging:
  level: "info"

mongo:
  # 生产建议用 TANGO_MONGO_URI 注入，避免把凭据写进文件
  uri: "mongodb://localhost:27017/tango"
  maxElapsedTime: "30s"

filter:
  # 只回填支付相关事件；同时下推到 SQL，减少数数侧扫描
  include:
    - '#type == "track" && #event_name == "PaymentOrderState"'

backfill:
  apiBaseURL: "https://api.lnk.events"
  token: ""                        # 用 TANGO_BACKFILL_TOKEN 之类注入更安全
  proxy: "socks5://user:pass@proxy-host:1080"   # 无需代理则留空
  projectID: 35
  schemaPrefix: "ta"               # → FROM ta.v_event_35
  table: "event"
  partDateRange:
    start: "2024-07-01"
    end:   "2024-07-31"
  # 可选：进一步用 #event_time 收窄到某时间段
  # eventTimeRange:
  #   start: "2024-07-14 00:00:00"
  #   end:   "2024-07-14 12:00:00"
  pageSize: 50000
  pageRetries: 3
  paginate: true                   # 服务端分页 + 逐页续传
  pollInterval: "5s"
  pollTimeout: "60m"
  runID: "backfill-event-2024-07"  # 同 runID 重启即断点续传
  forceSkipExisting: true
