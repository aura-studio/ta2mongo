# 场景：一次性全量导入（once）
# 把现有日志文件从头读一遍、处理完即退出，并打印统计摘要。
# 适合数据迁移、补数、CI 校验。
mode: "once"

logging:
  level: "info"

mongo:
  uri: "mongodb://localhost:27017/tango"
  maxElapsedTime: "30s"            # 大批量导入容忍更长重试

source:
  logPattern:
    - "/data/history/ta-*.log"
  maxLineBytes: 20971520           # 20MB，应对超长行

pipeline:
  batchSize: 5000                  # 离线导入可用更大批
  batchWorkers: 4
  flushInterval: "2s"

filter:
  include: []                      # 全量导入，不过滤
  exclude: []
