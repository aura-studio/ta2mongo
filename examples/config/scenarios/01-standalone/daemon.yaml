# 场景 1：standalone 模式 —— 纯上报，完全本地自治
#
# 启动：./start.sh   或   tango daemon standalone --config daemon.yaml
#
# 行为：追尾日志 → 解析 → 上报 filter → 写入 MongoDB。
#   - 不拉取远端配置（filter 完全由本文件决定，写死在本地）；
#   - 不注册心跳、不领取任何任务派发。
# 这是最“自治”的部署：节点只把本地日志写进库，任何中心端的配置文档 /
# 任务队列都不会影响它。standalone 模式不需要 agent 段，也忽略 report.remoteConfig。

common:
  logging:
    level: info
    format: text
  mongo:
    # 生产请用环境变量注入：TANGO_COMMON_MONGO_URI=mongodb://user:pass@host/db
    uri: mongodb://localhost:27017/tango
    maxElapsedTime: 10s

# 上报（上传）管线：对每条追尾到的记录生效。表达式跑在扁平化后的记录上，
# 故 #type / #event_name / properties.* 均可直接引用。
report:
  source:
    logPattern:
      - '/var/log/ta/.*\.log'
    tailMode: hybrid
    rescanInterval: 30s
  pipeline:
    batchSize: 1000
    batchWorkers: 4
    flushInterval: 1s
  filter:
    include:
      - '#type == "track"'
      - '#type == "user_set"'
    exclude:
      - 'debug == true'
