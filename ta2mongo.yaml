# ta2mongo 配置文件
#
# mode 决定运行模式：
#   - daemon：持续追尾日志文件，增量导入（默认）
#   - once：一次性读取所有匹配文件，处理完退出，输出统计摘要
#   - ingest：同步阻塞上传模式（从 CLI 参数或 stdin 读取）
#
# 也可通过子命令显式指定：ta2mongo daemon / ta2mongo once / ta2mongo ingest

mode: "daemon"

mongo:
  uri: "mongodb://localhost:27017/ta2mongo"

ta:
  # 每个字符串是一个正则，用于匹配文件路径
  logPattern:
    - "/mnt/shared-data-log/ta\\.production-.*"

tail:
  rescanSeconds: 30

batch:
  sizeMin: 100
  sizeInitial: 200
  sizeMax: 1000
  workerCount: 8
  flushIntervalMs: 1000

retry:
  maxElapsedTime: "10s"

log:
  level: "info"
